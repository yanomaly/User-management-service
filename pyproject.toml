[tool.poetry]
name = "user-management-service"
version = "0.1.0"
description = ""
authors = ["Johannes <tolstoy.work@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.11.8"
fastapi = "0.109.2"
uvicorn = "0.27.0.post1"
flake8 = "7.0.0"
black = "24.1.1"
isort = "5.13.2"
asyncio = "3.4.3"
sqlalchemy = "2.0.26"
pydantic = "2.6.1"
asyncpg = "0.29.0"
pyjwt = "2.8.0"
pika = "1.3.2"
redis = "5.0.1"
aioboto3 = "12.3.0"
pre-commit = "3.6.1"
pydantic-settings = "2.1.0"
alembic = "1.13.1"
passlib = "1.7.4"
bcrypt = "4.1.2"
python-multipart = "0.0.9"
pytest = "8.1.1"
pytest-asyncio = "0.23.6"
pytest-mock = "3.14.0"
httpx = "0.27.0"
pytest-dotenv = "0.5.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "user_management_service"
]
asyncio_mode="auto"
