[loggers]
keys=root,auth

[handlers]
keys=fileHandler

[formatters]
keys=fileFormatter

[logger_root]
level=INFO
handlers=

[logger_auth]
level=WARNING
handlers=fileHandler
qualname=auth
propagate=0

[handler_fileHandler]
class=FileHandler
level=WARNING
formatter=fileFormatter
args=('auth_logs.log',)

[formatter_fileFormatter]
format=f"%(asctime)s - [%(levelname)s] - %(name)s - (%(filename)s).%(funcName)s(%(lineno)d) - %(message)s"
datefmt='%d-%m-%Y %H:%M:%S
