[loggers]
keys=root,auth,users,base

[handlers]
keys=fileHandler_auth, fileHandler_users, fileHandler_base

[formatters]
keys=fileFormatter

[logger_root]
level=INFO
handlers=

[logger_auth]
handlers=fileHandler_auth
level=WARNING
qualname=auth
propagate=0

[logger_users]
handlers=fileHandler_users
level=INFO
qualname=users
propagate=0

[logger_base]
handlers=fileHandler_base
level=INFO
qualname=base
propagate=0

[handler_fileHandler_auth]
class=FileHandler
level=INFO
formatter=fileFormatter
args=('./logs/auth_logs.log','a',)

[handler_fileHandler_users]
class=FileHandler
level=INFO
formatter=fileFormatter
args=('./logs/users_logs.log','a',)

[handler_fileHandler_base]
class=FileHandler
level=INFO
formatter=fileFormatter
args=('./logs/base_logs.log','a',)

[formatter_fileFormatter]
format=f"%(asctime)s - [%(levelname)s] - %(name)s - (%(filename)s).%(funcName)s(%(lineno)d) - %(message)s"
datefmt='%d-%m-%Y %H:%M:%S
