version: '3'
services:

  pg-db:
    container_name: user-management-service-db
    image: postgres:15.6-alpine3.18
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - pg-db_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis-db:
    container_name: tokens-black-list-db
    image: redis:7.2.0-alpine3.18
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - redis-db_data:/data
    ports:
      - "6379:6379"

  app:
    build: .
    volumes:
    - .:/app/
    depends_on:
      - pg-db
      - redis-db
    ports:
      - "8000:8000"

volumes:
  pg-db_data:
  redis-db_data:
