version: '3'
services:

  pg-db:
    container_name: user-management-service-db
    image: postgres:15.6-alpine3.18
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - pg-db_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis-db:
    container_name: tokens-black-list-db
    image: redis:7.2.0-alpine3.18
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - redis-db_data:/data
    ports:
      - "6379:6379"

  localstack-service:
    container_name: localstack-service
    image: localstack/localstack:3.1
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack_entry.sh:/etc/localstack/init/ready.d/script.sh
    ports:
      - "4566:4566"

  app:
    build: .
    volumes:
    - .:/app/
    depends_on:
      - pg-db
      - redis-db
      - localstack-service
    ports:
      - "8000:8000"

volumes:
  pg-db_data:
  redis-db_data:
