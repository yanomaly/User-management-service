version: '3'
services:

  pg-db:
    container_name: pg-db
    image: postgres:15.6-alpine3.18
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - pg-db_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis-db:
    container_name: redis-db
    image: redis:7.2.0-alpine3.18
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - redis-db_data:/data
    ports:
      - "6379:6379"

  rabbit-mq:
    container_name: rabbit-mq
    image: rabbitmq:3.12.10-management
    hostname: rabbit-mq
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - rabbit-mq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  localstack-service:
    container_name: localstack-service
    image: localstack/localstack:3.1
    restart: on-failure
    env_file:
      - user_management_service/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./localstack_entry.sh:/etc/localstack/init/ready.d/script.sh
    ports:
      - "4566:4566"

  app:
    build: .
    volumes:
    - .:/app/
    depends_on:
      - pg-db
      - redis-db  
      - rabbit-mq
      - localstack-service
    ports:
      - "8000:8000"

volumes:
  pg-db_data:
  redis-db_data:
  rabbit-mq_data:
